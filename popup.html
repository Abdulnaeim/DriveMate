<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DriveShare Downloader</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f5f7fa;
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        height: 300px;
        width: 350px;
        padding: 20px;
        text-align: center;
        border-radius: 12px;
        overflow: hidden;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        margin-bottom: 15px;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        color: #1976d2;
      }
      #notDriveMessage {
        padding: 20px;
        text-align: center;
        font-size: 14px;
        line-height: 1.5;
        color: #d32f2f;
        margin-top: 40px;
      }
      #downloadContainer {
        width: 100%;
        height: 220px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding-right: 10px;
      }
      #downloadContainer::-webkit-scrollbar {
        width: 6px;
      }
      #downloadContainer::-webkit-scrollbar-thumb {
        background: #bbb;
        border-radius: 3px;
      }
      .video-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }
      .video-title {
        flex: 1;
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .download-btn {
        background: #1976d2;
        border: none;
        cursor: pointer;
        color: white;
        font-size: 13px;
        padding: 6px 12px;
        border-radius: 6px;
        transition: background 0.3s ease;
      }
      .download-btn:hover {
        background: #1565c0;
      }
      #statusMessage {
        margin-top: 10px;
        font-size: 14px;
        max-width: 100%;
      }
      .error {
        color: #d32f2f;
      }
      .button-group {
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .state-btn {
        padding: 6px 16px;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        font-size: 12px;
        font-weight: bold;
        transition: all 0.3s ease;
      }
      .state-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .state-btn.hidden {
        display: none;
      }
      .btn-on {
        background-color: #4caf50;
        color: white;
      }
      .btn-on:hover {
        background-color: #43a047;
      }
      .btn-off {
        background-color: #f44336;
        color: white;
      }
      .btn-off:hover {
        background-color: #e53935;
      }
      .reload-btn {
        background: none;
        border: none;
        color: #1976d2;
        cursor: pointer;
        display: none;
        font-size: 16px;
        padding: 0 5px;
      }
      .reload-btn.active {
        display: block;
      }
      footer {
        margin-top: 15px;
        font-size: 12px;
        color: #666;
      }
      footer a {
        color: #1976d2;
        text-decoration: none;
      }
      footer a:hover {
        text-decoration: underline;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>DriveMate</h1>
      <div class="button-group">
        <button class="reload-btn" title="Reload">↻</button>
        <button class="state-btn btn-on hidden" id="btnOn">ON</button>
        <button class="state-btn btn-off hidden" id="btnOff" disabled>
          OFF
        </button>
      </div>
    </div>
    <div id="notDriveMessage" class="hidden">
      Use this extension on Google Drive file pages to securely download files
      you have access to.
    </div>
    <div id="downloadContainer" class="hidden"></div>
    <div id="statusMessage" class="hidden"></div>
    <script src="popup.js"></script>
    <footer>
      Developer:
      <a
        href="https://github.com/TariqKingCoder"
        rel="noopener noreferrer"
        target="_blank"
      >
        Tariq Ahmadzai
      </a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
